name: Refresh profile card

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/render-profile-card.py"
      - ".github/workflows/profile-stats.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PROFILE_OWNER: sil6428
      GH_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
      OTNOW_STATS_URL: https://otnow-stats.sil6428-archtech.workers.dev/api/stats
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Render profile card
        run: python3 .github/scripts/render-profile-card.py

      - name: Publish changed card
        run: |
          if git diff --quiet -- assets/profile-dark.svg assets/profile-light.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-dark.svg assets/profile-light.svg
          git commit -m "Refresh profile card [skip ci]"
          git push
