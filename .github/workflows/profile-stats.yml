name: Refresh CyberGlass terminal

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/render-profile-terminal.py"
      - ".github/workflows/profile-stats.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyberglass-profile-terminal
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PROFILE_OWNER: sil6428
      GH_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
      OTNOW_STATS_URL: https://otnow-stats.sil6428-archtech.workers.dev/api/stats
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create renderer environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Render CyberGlass terminal
        run: .venv/bin/python .github/scripts/render-profile-terminal.py

      - name: Publish changed terminal
        run: |
          if git diff --quiet -- assets/cyberglass-whoami.gif assets/cyberglass-terminal-static.png; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cyberglass-whoami.gif assets/cyberglass-terminal-static.png
          git commit -m "Refresh CyberGlass terminal [skip ci]"
          git push
