name: Refresh profile statistics

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/render-profile-stats.mjs"
      - ".github/workflows/profile-stats.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PROFILE_OWNER: sil6428
      GH_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate activity card
        run: node .github/scripts/render-profile-stats.mjs

      - name: Publish changed statistics
        run: |
          if git diff --quiet -- profile/stats.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Refresh profile statistics [skip ci]"
          git push
